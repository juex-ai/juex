name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_parallelism:
        description: Windows race package parallelism to benchmark
        required: true
        type: choice
        default: "2"
        options:
          - "1"
          - "2"
          - default

jobs:
  frontend:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: make web-check

  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Prepare embedded web dist
        run: make web-stub
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      # uv is needed by the e2e Python MCP fixture and tests/eval contract tests.
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Install and probe Linux sandbox backend
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 AppArmor blocks the user namespace that bwrap needs.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
          fi
          bwrap --die-with-parent --ro-bind / / --dev /dev -- /bin/true
      - name: Prepare embedded web dist
        run: make web-stub
        shell: bash
      - name: Prepare pinned ripgrep
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^VERSION=/{sub(/\r$/, "", $2); print $2; exit}' CLI_CONFIG)"
          os_name="$(go env GOOS)"
          arch="$(go env GOARCH)"
          scripts/prepare-ripgrep.sh \
            --target "${os_name}_${arch}" \
            --juex-version "$version" \
            --output .tmp/ci-ripgrep
          rg_dir="$PWD/.tmp/ci-ripgrep/juex-path"
          if [[ "$os_name" == "windows" ]]; then
            rg_dir="$(cygpath -w "$rg_dir")"
          fi
          printf '%s\n' "$rg_dir" >> "$GITHUB_PATH"
      - name: Build Juex evaluator binary
        shell: bash
        run: |
          set -euo pipefail
          juex_bin="$PWD/.tmp/ci-juex$(go env GOEXE)"
          go build -o "$juex_bin" ./cmd/juex
          if [[ "$(go env GOOS)" == "windows" ]]; then
            juex_bin="$(cygpath -w "$juex_bin")"
          fi
          printf 'JUEX_BIN=%s\n' "$juex_bin" >> "$GITHUB_ENV"
      - name: Run Go race tests
        if: matrix.os != 'windows-latest'
        run: go test ./... -race -count=1
        shell: bash
      - name: Record Windows race benchmark environment
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/windows-race
          {
            printf 'head_sha=%s\n' "$GITHUB_SHA"
            printf 'parallelism=%s\n' "${{ inputs.windows_parallelism }}"
            printf 'number_of_processors=%s\n' "${NUMBER_OF_PROCESSORS:-unknown}"
            printf 'gomaxprocs=%s\n' "${GOMAXPROCS:-auto}"
            printf 'home=%s\n' "$HOME"
            printf 'juex_home=%s\n' "${JUEX_HOME:-<default>}"
            go version
            go env GOOS GOARCH GOVERSION GOPATH GOCACHE GOTMPDIR
            pwsh -NoProfile -Command \
              'Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory | ConvertTo-Json -Compress'
          } | tee .tmp/windows-race/environment.txt
      - name: Run Go race tests on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ inputs.windows_parallelism || '2' }}"
          race_args=()
          if [[ "$mode" != "default" ]]; then
            race_args+=("-p=$mode")
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            go test -json ./... -race -count=1 "${race_args[@]}" |
              tee .tmp/windows-race/go-test.jsonl
          else
            go test ./... -race -count=1 "${race_args[@]}"
          fi
      - name: Test release installer
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^VERSION=/{sub(/\r$/, "", $2); print $2; exit}' CLI_CONFIG)"
          os_name="$(go env GOOS)"
          arch="$(go env GOARCH)"
          work="${RUNNER_TEMP}/juex-install-test"
          release_dir="${work}/release"
          payload_dir="${work}/payload"
          package_root="${payload_dir}/juex_${version}_${os_name}_${arch}"
          rm -rf "$work"
          mkdir -p "$release_dir" "$package_root/bin"

          cp -R .tmp/ci-ripgrep/. "$package_root/"
          go build -trimpath \
            -ldflags "-X github.com/juex-ai/juex/internal/version.Version=${version}" \
            -o "${package_root}/bin/juex" ./cmd/juex
          archive="juex_${version}_${os_name}_${arch}.tar.gz"
          tar -C "$payload_dir" -czf "${release_dir}/${archive}" "$(basename "$package_root")"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$release_dir" && sha256sum "$archive" > checksums.txt)
          else
            (cd "$release_dir" && shasum -a 256 "$archive" > checksums.txt)
          fi

          JUEX_INSTALL_RELEASE_BASE_URL="file://${release_dir}" \
            JUEX_INSTALL_VERSION="$version" \
            JUEX_INSTALL_OS="$os_name" \
            JUEX_INSTALL_ARCH="$arch" \
            bash scripts/install.sh

          if [[ ":$PATH:" != *":$HOME/.local/bin:"* ]]; then
            export PATH="$HOME/.local/bin:$PATH"
            printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          juex version
          juex init --provider openai --model ci --api-key sk-ci-placeholder --skip-check --yes
          set +e
          juex doctor --format json --offline > "${work}/doctor.json"
          doctor_status=$?
          set -e
          cat "${work}/doctor.json"
          [[ "$doctor_status" -eq 0 || "$doctor_status" -eq 6 || "$doctor_status" -eq 7 ]]
          grep -B 8 -A 8 '"name": "ripgrep"' "${work}/doctor.json" |
            grep -q '"status": "ok"'
          grep -B 8 -A 8 '"name": "ripgrep"' "${work}/doctor.json" |
            grep -q '"source": "package"'
          installed_binary="$(readlink "$HOME/.local/bin/juex")"
          package_root="$(cd "$(dirname "$installed_binary")/.." && pwd -P)"
          "$package_root/juex-path/rg" --version
      - name: Test PowerShell release installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path CLI_CONFIG -Pattern '^VERSION=(.+)$').Matches[0].Groups[1].Value.TrimEnd("`r")
          $work = Join-Path $env:RUNNER_TEMP "juex-install-test"
          $releaseDir = Join-Path $work "release"
          $payloadDir = Join-Path $work "payload"
          $packageRoot = Join-Path $payloadDir "juex_${version}_windows_amd64"
          Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $releaseDir, (Join-Path $packageRoot "bin") | Out-Null

          Copy-Item -Path ".tmp/ci-ripgrep/*" -Destination $packageRoot -Recurse -Force
          $binary = Join-Path $packageRoot "bin/juex.exe"
          go build -trimpath `
            -ldflags "-X github.com/juex-ai/juex/internal/version.Version=$version" `
            -o $binary ./cmd/juex
          $archive = "juex_${version}_windows_amd64.zip"
          $archivePath = Join-Path $releaseDir $archive
          Compress-Archive -LiteralPath $packageRoot -DestinationPath $archivePath -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $releaseDir "checksums.txt") -Value "$hash  $archive"

          $env:JUEX_INSTALL_RELEASE_BASE_URL = ($releaseDir -replace '\\', '/')
          $env:JUEX_INSTALL_VERSION = $version
          $env:JUEX_INSTALL_OS = "windows"
          $env:JUEX_INSTALL_ARCH = "amd64"
          ./scripts/install.ps1

          $binDir = Join-Path $HOME ".local\bin"
          if (-not (($env:PATH -split [System.IO.Path]::PathSeparator) -contains $binDir)) {
            $env:PATH = "$binDir$([System.IO.Path]::PathSeparator)$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $binDir
          }
          juex.exe version
          juex.exe init --provider openai --model ci --api-key sk-ci-placeholder --skip-check --yes
          $oldNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          $doctorText = (juex.exe doctor --format json --offline | Out-String)
          $doctorStatus = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $oldNativePreference
          Write-Output $doctorText
          if ($doctorStatus -ne 0 -and $doctorStatus -ne 6 -and $doctorStatus -ne 7) {
            throw "juex doctor failed with exit code $doctorStatus"
          }
          $ripgrepCheck = ($doctorText | ConvertFrom-Json).checks |
            Where-Object { $_.name -eq "ripgrep" }
          if ($ripgrepCheck.status -ne "ok" -or $ripgrepCheck.details.source -ne "package") {
            throw "installed JueX did not resolve packaged ripgrep: $doctorText"
          }
          & $ripgrepCheck.details.path --version
          if ($LASTEXITCODE -ne 0) {
            throw "packaged ripgrep failed with exit code $LASTEXITCODE"
          }
      - name: Upload Windows race benchmark evidence
        if: always() && matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-race-${{ github.run_id }}-${{ inputs.windows_parallelism }}
          path: .tmp/windows-race
          if-no-files-found: warn
          retention-days: 14
