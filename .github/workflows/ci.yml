name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test change detection
        run: python3 -m unittest scripts.test_ci_changes
      - name: Detect documentation-only changes
        id: changes
        run: python3 scripts/ci_changes.py

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: make docs-check

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    # Detection failures must not silently skip the existing checks.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: make web-check

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The pinned analyzer cannot decode Go 1.27.2 export data. Other
          # jobs still test stable; keep analysis on its verified compiler.
          go-version: '1.26.4'
          cache: true
      - name: Prepare embedded web dist
        run: make web-stub
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

  management-postgres:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: juex-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: make web-stub
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Verify managed service transactions against PostgreSQL
        env:
          JUEX_TEST_POSTGRES_URL: postgres://postgres:juex-ci-only@localhost:5432/postgres?sslmode=disable
        run: make integration-contracts

  test:
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      # uv is needed by the e2e Python MCP fixture and tests/eval contract tests.
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Prepare embedded web dist
        run: make web-stub
        shell: bash
      - name: Run Go race tests
        run: go test ./... -race -count=1
        shell: bash
      - name: Verify deployment operator and validation harness
        run: uv run python -m unittest discover -s deploy/managed

  platform-image:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/managed/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/managed/Dockerfile.hosted
          push: false
