name: integration
on:
  workflow_dispatch:

jobs:
  live:
    name: live (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider:
          - anthropic
          - openai
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: juex-ci-only
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JUEX_TEST_POSTGRES_URL: postgres://postgres:juex-ci-only@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Write live provider config
        env:
          LIVE_PROVIDER: ${{ matrix.provider }}
          ANTHROPIC_PROTOCOL: ${{ secrets.PROVIDER_API_PROTOCOL_ANTHROPIC }}
          ANTHROPIC_BASE:  ${{ secrets.PROVIDER_API_BASE_ANTHROPIC }}
          ANTHROPIC_KEY:   ${{ secrets.PROVIDER_API_KEY_ANTHROPIC }}
          ANTHROPIC_MODEL: ${{ secrets.PROVIDER_API_MODEL_ANTHROPIC }}
          OPENAI_PROTOCOL: ${{ secrets.PROVIDER_API_PROTOCOL_OPENAI }}
          OPENAI_BASE:     ${{ secrets.PROVIDER_API_BASE_OPENAI }}
          OPENAI_KEY:      ${{ secrets.PROVIDER_API_KEY_OPENAI }}
          OPENAI_MODEL:    ${{ secrets.PROVIDER_API_MODEL_OPENAI }}
        run: |
          set -euo pipefail
          umask 077
          export JUEX_PROVIDER_CONFIG="$RUNNER_TEMP/juex-integration-${LIVE_PROVIDER}.yaml"
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          selected = os.environ["LIVE_PROVIDER"]
          prefix = selected.upper()
          for field in ("PROTOCOL", "BASE", "KEY", "MODEL"):
              if not os.environ.get(prefix + "_" + field):
                  raise SystemExit("missing selected provider secret: " + field)
          config = {"models": [{
              "provider": "ci-" + selected,
              "name": os.environ[prefix + "_MODEL"],
              "protocol": os.environ[prefix + "_PROTOCOL"],
              "endpoint": os.environ[prefix + "_BASE"],
              "api_key": os.environ[prefix + "_KEY"],
              "context_window": 131072,
              "max_output": 8192,
          }]}
          path = Path(os.environ["JUEX_PROVIDER_CONFIG"])
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
          printf 'JUEX_PROVIDER_CONFIG=%s\n' "$JUEX_PROVIDER_CONFIG" >> "$GITHUB_ENV"
      - run: make web-stub integration
      - run: bash tests/eval/provider_model_smoke.sh
      - run: bash tests/eval/compaction_eval.sh
