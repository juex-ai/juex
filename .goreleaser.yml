project_name: juex
version: 2

before:
  hooks:
    - pnpm --dir frontend install --frozen-lockfile
    - pnpm --dir frontend build
    - make web-sync

builds:
  - id: juex
    main: ./cmd/juex
    binary: bin/juex
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: &metadata
      - -s -w
      - -X github.com/juex-ai/juex/internal/foundation/version.Version={{.Version}}
      - -X github.com/juex-ai/juex/internal/foundation/version.Commit={{.ShortCommit}}
      - -X github.com/juex-ai/juex/internal/foundation/version.BuildTime={{.Date}}
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: juex-executor
    main: ./cmd/juex-executor
    binary: bin/juex-executor
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: *metadata
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  - id: juex-management
    main: ./cmd/juex-management
    binary: bin/juex-management
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: *metadata
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: juex-runtime
    main: ./cmd/juex-runtime
    binary: bin/juex-runtime
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: *metadata
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: juex-memory
    main: ./cmd/juex-memory
    binary: bin/juex-memory
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: *metadata
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: juex-calendar
    main: ./cmd/juex-calendar
    binary: bin/juex-calendar
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: *metadata
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: juex-execution
    main: ./cmd/juex-execution
    binary: bin/juex-execution
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: *metadata
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: juex-service-log
    main: ./cmd/juex-service-log
    binary: bin/juex-service-log
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: *metadata
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  - id: juex-migrate
    main: ./cmd/juex-migrate
    binary: bin/juex-migrate
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: *metadata
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: clients
    ids: [juex, juex-executor]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats: [tar.gz]
    wrap_in_directory: true
    files: [README.md, README.zh.md]

  - id: platform
    ids: [juex, juex-executor, juex-management, juex-runtime, juex-memory, juex-calendar, juex-execution, juex-service-log, juex-migrate]
    name_template: "{{.ProjectName}}_platform_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats: [tar.gz]
    wrap_in_directory: true
    files:
      - README.md
      - README.zh.md
      - deploy/managed/README.md
      - deploy/managed/README.zh.md
      - deploy/managed/operator.py
      - deploy/managed/common.py
      - deploy/managed/host.py
      - deploy/managed/hosted.py
      - deploy/managed/processes.py
      - deploy/managed/nginx.conf
      - deploy/managed/compose.yaml

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: juex-ai
    name: juex
  draft: false
  prerelease: auto
