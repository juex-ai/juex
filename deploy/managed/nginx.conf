events {}
http {
  # The ingress sees client connections; Management only sees this proxy.
  map $request_method $auth_client {
    default "";
    POST $binary_remote_addr;
  }
  limit_req_zone $auth_client zone=auth:10m rate=120r/m;
  server {
    listen 443 ssl;
    ssl_certificate /run/juex/tls/certificate.pem;
    ssl_certificate_key /run/juex/tls/key.pem;
    ssl_protocols TLSv1.3;
    client_max_body_size 4m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 300s;
    location /device/ {
      proxy_pass http://execution:8683;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
    location /api/auth/ {
      limit_req zone=auth burst=120 nodelay;
      limit_req_status 429;
      error_page 429 = @auth_rate_limited;
      proxy_pass http://management:8680;
    }
    location @auth_rate_limited {
      default_type application/json;
      add_header Retry-After 1 always;
      add_header Cache-Control no-store always;
      return 429 '{"code":"rate_limited","error":"too many attempts; try again later"}';
    }
    location / { proxy_pass http://management:8680; }
  }
}
